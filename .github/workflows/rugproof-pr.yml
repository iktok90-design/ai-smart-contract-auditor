name: AuditSentry — PR audit

on:
  pull_request:
    paths:
      - "**/*.sol"
      - "**/*.vy"
      - ".auditsentry.yml"
      - ".auditsentryignore"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auditsentry-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit changed contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build MCP servers
        working-directory: mcp
        run: |
          npm install
          npm run build

      - name: Build scripts
        working-directory: scripts
        run: |
          npm install
          npm run build

      - name: Fetch Solidity deps
        run: bash scripts/ci-fetch-deps.sh

      - name: Forge build (sanity)
        # A PR that doesn't compile can't be meaningfully audited — surface it as
        # a warning annotation but keep going so the audit comment still posts.
        run: |
          if ! forge build --sizes; then
            echo "::warning::forge build failed — audit runs on un-compilable sources and may be incomplete"
          fi

      - name: Run AuditSentry on diff
        id: auditsentry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set; running in dry-run mode (no LLM calls)"
            echo '{"findings":[],"counts":{"critical":0,"high":0,"medium":0,"low":0,"info":0},"grade":"?"}' > auditsentry-findings.json
          else
            npx -y @anthropic-ai/claude-code \
              code -p "/audit-changes ${{ github.base_ref }}" \
              --output-format json > auditsentry-findings.json || true
          fi
          BLOCKING=$(node -e '
            const f=require("./auditsentry-findings.json");
            const map={info:0,low:1,medium:2,high:3,critical:4};
            const th=map["${{ vars.RUGPROOF_THRESHOLD || 'high' }}"]||3;
            console.log((f.findings||[]).filter(x=>map[(x.severity||"info").toLowerCase()]>=th).length);
          ')
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"

      - name: Render PR comment
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            const f=JSON.parse(fs.readFileSync("auditsentry-findings.json","utf8"));
            const c=f.counts||{};
            const top=(f.findings||[]).slice(0,5).map(x=>`- **[${x.severity}]** \`${x.id}\` ${x.title} — \`${x.path}:${x.line}\``).join("\n") || "_no findings_";
            const body=[
              "## 🛡 AuditSentry audit",
              "",
              `| Severity | Count |`,
              `|---|---|`,
              `| Critical | **${c.critical||0}** |`,
              `| High | **${c.high||0}** |`,
              `| Medium | ${c.medium||0} |`,
              `| Low | ${c.low||0} |`,
              `| Info | ${c.info||0} |`,
              `| **Grade** | **${f.grade||"?"}** |`,
              "",
              "### Top findings",
              top,
              "",
              "_Generated by [AuditSentry](https://iktok90-design.github.io/AuditSentry) — `auditsentry your code before someone else does`_"
            ].join("\n");
            fs.writeFileSync("pr-comment.md", body);
          '

      - name: Post comment on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: pr-comment.md
          header: auditsentry

      - name: Upload findings JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditsentry-findings
          path: auditsentry-findings.json
          retention-days: 30

      - name: Fail PR on blocking findings
        if: steps.auditsentry.outputs.blocking != '0'
        run: |
          echo "::error::AuditSentry found ${{ steps.auditsentry.outputs.blocking }} blocking finding(s) (severity >= ${{ vars.RUGPROOF_THRESHOLD || 'high' }})"
          exit 1
