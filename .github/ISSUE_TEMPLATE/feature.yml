name: Feature request
description: Propose a new command, skill, agent, or MCP tool
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feature?
      options:
        - New slash command
        - New vulnerability skill
        - New specialist subagent
        - New MCP tool
        - New hook
        - New report format
        - Workflow / DX improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? What's the user-visible win?
      placeholder: "Audits of <protocol type> currently miss <pattern>; adding X would catch it."
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Sketch the interface (slash command name + args, skill detection rule, agent triggers, etc.)

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one wins.

  - type: checkboxes
    id: scope
    attributes:
      label: Pre-flight
      options:
        - label: I've checked existing skills/agents to make sure this isn't duplicated
        - label: I'm willing to draft a PR for this
