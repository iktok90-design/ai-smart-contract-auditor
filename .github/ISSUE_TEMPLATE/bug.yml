name: Bug report
description: Report a bug in AuditSentry itself (not in a contract AuditSentry audited)
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Reporting a vulnerability *in AuditSentry itself*? Do NOT use this — see [SECURITY.md](../../SECURITY.md) for private disclosure.
        Reporting a bug in a contract AuditSentry audited? File with the contract's protocol bounty program, not here.

  - type: input
    id: version
    attributes:
      label: AuditSentry version
      description: From `.claude-plugin/plugin.json` "version" field.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where the bug lives
      options:
        - Slash command
        - Subagent
        - Vulnerability skill
        - MCP server
        - Hook
        - Script (render-card / render-report / etc.)
        - Foundry / NFT / web
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact steps. Include the slash command, target file, expected vs actual.
      placeholder: |
        1. Run `/audit examples/Foo.sol`
        2. Expected: finding REENT-001 reported
        3. Actual: no findings
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Forge version, Claude Code version.
      placeholder: "macOS 14.5, Node 20.11, Forge 1.5.1, Claude Code latest"

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant output. Use code fences.
      render: text
