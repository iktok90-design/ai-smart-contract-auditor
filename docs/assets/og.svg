<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8a849"/>
      <stop offset="100%" stop-color="#c4843a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1f262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Top eyebrow -->
  <text x="80" y="80" fill="#8b949e" font-size="22" letter-spacing="6"
        font-weight="600">RUGPROOF · SMART CONTRACT SECURITY</text>

  <!-- Headline -->
  <text x="80" y="240" fill="#e6edf3" font-size="84" font-weight="900" letter-spacing="-2">
    Rugproof your code
  </text>
  <text x="80" y="340" fill="url(#accent-fade)" font-size="84" font-weight="900" letter-spacing="-2">
    before someone else does.
  </text>

  <!-- Sub -->
  <text x="80" y="410" fill="#8b949e" font-size="28">
    A Claude Code plugin: vuln detection · exploit PoCs · mainnet-fork sims · audit cards.
  </text>

  <!-- Pills -->
  <g font-family="ui-monospace, monospace" font-size="20">
    <g transform="translate(80, 450)">
      <rect width="140" height="44" rx="22" fill="#1f262d" stroke="#30363d"/>
      <text x="70" y="29" fill="#8b949e" text-anchor="middle">Solidity</text>
    </g>
    <g transform="translate(232, 450)">
      <rect width="140" height="44" rx="22" fill="#1f262d" stroke="#30363d"/>
      <text x="70" y="29" fill="#8b949e" text-anchor="middle">Vyper</text>
    </g>
    <g transform="translate(384, 450)">
      <rect width="170" height="44" rx="22" fill="#1f262d" stroke="#30363d"/>
      <text x="85" y="29" fill="#8b949e" text-anchor="middle">Foundry · Hardhat</text>
    </g>
    <g transform="translate(566, 450)">
      <rect width="170" height="44" rx="22" fill="#1f262d" stroke="#f8a849"/>
      <text x="85" y="29" fill="#f8a849" text-anchor="middle">+ Berachain</text>
    </g>
    <g transform="translate(748, 450)">
      <rect width="170" height="44" rx="22" fill="#1f262d" stroke="#30363d"/>
      <text x="85" y="29" fill="#8b949e" text-anchor="middle">9 EVM chains</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="80" y="580" fill="#f8a849" font-size="32" font-weight="800" letter-spacing="2">RUGPROOF</text>
  <text x="1120" y="580" fill="#8b949e" font-size="22" text-anchor="end" font-family="ui-monospace, monospace">omermaksutii.github.io/RugProof</text>
</svg>
